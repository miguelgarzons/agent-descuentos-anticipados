<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descuentos Anticipados - CUN</title>
</head>
<body style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background-color:#f5f5f5;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:20px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
                    <!-- Header -->
                    <tr>
                        <td style="background-color:#004b8d;padding:24px;text-align:center;">
                            <h1 style="margin:0;color:#ffffff;font-size:20px;font-weight:bold;">
                                Gestión Financiera — CUN
                            </h1>
                            <p style="margin:6px 0 0 0;color:#cfe0f2;font-size:13px;">
                                Descuentos Anticipados
                            </p>
                        </td>
                    </tr>

                    <!-- Contenido (respuesta ya renderizada por el respondedor) -->
                    <tr>
                        <td style="padding:24px;color:#333333;font-size:14px;line-height:1.6;">
                            {{ respuesta_html }}

                            <!-- Detalles del caso -->
                            <table width="100%" cellpadding="0" cellspacing="0" style="margin:24px 0 0 0;">
                                <tr>
                                    <td style="padding:12px;background-color:#f5f5f5;border-radius:4px;">
                                        <p style="margin:0 0 8px 0;color:#666666;font-size:12px;text-transform:uppercase;letter-spacing:.5px;">
                                            Detalles del caso
                                        </p>
                                        <p style="margin:4px 0;color:#333333;font-size:14px;">
                                            <strong>Ticket:</strong> {{ ticket_id }}
                                        </p>
                                        <p style="margin:4px 0;color:#333333;font-size:14px;">
                                            <strong>Categoría:</strong> {{ categoria }}
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Firma institucional (watermark) -->
                    <tr>
                        <td style="background-color:#ffffff;padding:0 24px 16px 24px;">
                            {{ watermark_html }}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#f5f5f5;padding:16px;text-align:center;border-top:1px solid #e0e0e0;">
                            <p style="margin:0;color:#666666;font-size:12px;line-height:1.6;">
                                Mensaje automático del Agente de Descuentos Anticipados — CUN.<br>
                                Por favor no respondas directamente a este correo.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
